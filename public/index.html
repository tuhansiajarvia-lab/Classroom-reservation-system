<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varausjärjestelmä</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран авторизации и регистрации -->
    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tabs">
                <button id="showLoginTab" class="auth-tab active">Kirjaudu sisään</button>
                <button id="showRegisterTab" class="auth-tab">Rekisteröidy</button>
            </div>

            <!-- Форма входа -->
            <div id="loginSection" class="auth-form-section">
                <h2>Kirjaudu sisään</h2>
                <div class="form-group">
                    <label for="loginEmail">Sähköposti</label>
                    <input type="email" id="loginEmail" placeholder="esimerkki@domain.fi">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Salasana</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button id="loginBtn" class="primary-btn">Kirjaudu</button>
                <div class="toggle-auth">
                    <span>Eikö sinulla ole tiliä? </span>
                    <button id="switchToRegBtn" class="link-btn">Rekisteröidy tästä</button>
                </div>
            </div>

            <!-- Форма регистрации -->
            <div id="registerSection" class="auth-form-section" style="display: none;">
                <h2>Rekisteröidy käyttäjäksi</h2>
                <div class="form-group">
                    <label for="regName">Nimi</label>
                    <input type="text" id="regName" placeholder="Matti Meikäläinen">
                </div>
                <div class="form-group">
                    <label for="regEmail">Sähköposti</label>
                    <input type="email" id="regEmail" placeholder="esimerkki@domain.fi">
                </div>
                <div class="form-group">
                    <label for="regPassword">Salasana</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>
                <button id="registerBtn" class="primary-btn">Rekisteröidy</button>
                <div class="toggle-auth">
                    <span>Onko sinulla jo tili? </span>
                    <button id="switchToLoginBtn" class="link-btn">Kirjaudu sisään</button>
                </div>
            </div>

            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <!-- Основное приложение (после входа) -->
    <div id="mainView" style="display: none;">
        <!-- Шапка с заглавием по центру -->
        <header class="app-header">
            <h1 class="logo">Varausjärjestelmä</h1>
            <div class="user-info">
                <span id="userNameDisplay">Käyttäjä</span>
                <button id="logoutBtn" class="danger-btn">Kirjaudu ulos</button>
            </div>
        </header>

        <!-- Навигация по вкладкам -->
        <nav class="app-nav">
            <button class="nav-tab active" data-target="classroomsTab">Luokat ja Varaukset</button>
            <button class="nav-tab" data-target="reservationsTab">Omat varaukset</button>
        </nav>

        <!-- Вкладка 1: Список аудиторий и выбор мест -->
        <main id="classroomsTab" class="tab-content container">
            <div class="toolbar">
                <h2>Valitse luokkahuone</h2>
                <div class="date-picker-group">
                    <label for="bookingDate">Päivämäärä:</label>
                    <input type="date" id="bookingDate">
                </div>
            </div>

            <!-- Скрытый системный селект для связки с JS -->
