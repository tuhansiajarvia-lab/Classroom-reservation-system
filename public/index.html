<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luokat ja Varaukset | Varausjärjestelmä</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка с центрированным логотипом -->
    <header class="app-header">
        <h1 class="logo">Varausjärjestelmä</h1>
        <div class="user-info">
            <span id="userNameDisplay">Käyttäjä</span>
            <button id="logoutBtn" class="danger-btn">Kirjaudu ulos</button>
        </div>
    </header>

    <!-- Навигация -->
    <nav class="app-nav">
        <a href="index.html" class="nav-tab active">Luokat ja Varaukset</a>
        <a href="reservations.html" class="nav-tab">Omat varaukset</a>
    </nav>

    <!-- Основной контент -->
    <main class="container">
        <div class="toolbar">
            <h2>Valitse luokkahuone</h2>
            <div class="date-picker-group">
                <label for="bookingDate">Päivämäärä:</label>
                <input type="date" id="bookingDate">
            </div>
        </div>

        <!-- Скрытый системный селект для связки с JS -->
        <select id="classroomSelect" style="display: none;"></select>

        <!-- Карточки аудиторий -->
        <div id="classroomsGrid" class="classrooms-grid"></div>

        <!-- Админ-панель добавления классов -->
        <div id="adminSection" style="display: none;" class="admin-panel">
            <h3>Ylläpito: Lisää uusi luokkahuone</h3>
            <div class="admin-form">
                <input type="text" id="adminClassroomName" placeholder="Luokan nimi (esim. Alfa)" />
                <input type="number" id="adminClassroomRows" placeholder="Rivien määrä" min="1" />
                <input type="number" id="adminClassroomSeats" placeholder="Paikkojen määrä rivillä" min="1" />
                <button type="button" id="addClassroomBtn">Lisää luokka</button>
            </div>
            <p id="adminClassroomMessage"></p>
        </div>
    </main>

    <!-- Модальное окно бронирования класса (схема слева, информация справа) -->
    <div id="seatModal" class="modal" style="display: none;">
        <div class="modal-content classroom-modal-content">
            <span id="closeModalBtn" class="close-btn">&times;</span>
            <h2 id="modalClassroomTitle">Luokan varaus</h2>

            <div class="classroom-modal-body">
                <div class="classroom-diagram-panel" id="classroomDiagram"></div>

                <div class="classroom-details-panel">
                    <ul class="classroom-specs-list">
                        <li><strong>Paikkojen määrä:</strong> <span id="modalSeatsCount">-</span></li>
                        <li><strong>Projektori:</strong> <span id="modalProjectorStatus">Kyllä (Full HD)</span></li>
                        <li><strong>Interaktiivinen taulu:</strong> <span id="modalSmartboardStatus">Kyllä (Smart Board)</span></li>
                        <li><strong>Päivämäärä:</strong> <span id="modalBookingDate">-</span></li>
                    </ul>

                    <div class="modal-actions">
                        <button type="button" id="reserveBtn" class="primary-btn">Varaa luokka</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
